set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g repeat-time 1000  # increase "prefix-free" window
set -g history-limit 1000000     # increase history size (from 2,000)

set -g allow-passthrough on
set -s set-clipboard on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# If NOT in SSH session: set color to blue and change prefix key
if-shell '[ -z "$SSH_CLIENT" ]' {
  unbind C-b
  set -g prefix ^A
  set -g pane-active-border-style 'fg=#89B4FA,bg=default'
  set -g @minimal-tmux-bg "#89B4FA"
}

# If IN SSH session: set color to green only and keep default ctrl + b prefix
if-shell '[ -n "$SSH_CLIENT" ]' {
  set -g pane-active-border-style 'fg=#B4FB73,bg=default'
  set -g @minimal-tmux-bg "#B4FB73"
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'niksingh710/minimal-tmux-status'
# set -g @plugin 'Morantron/tmux-fingers'

# setup fingers plugin
# set -g @fingers-key Space
# set -g @fingers-hint-style 'fg=red,bold'

set -g pane-border-style 'fg=#333333,bg=default'
set -g @minimal-tmux-indicator-str " ◯ "
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-status-right "#H:#S"
# add small gap above status bar
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g status 2

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# atlernative way to switch planes prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize window
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
# Resize pane using prefix + capital H/J/K/L; e.g., for ssh usage
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# bind-key -T copy-mode-vi n send -X next-prompt -o
# bind-key -T copy-mode-vi p send -X previous-prompt -o
# use esc to exit copy mode
# bind-key -T copy-mode-vi Escape send-keys -X cancel
# disable release mouse click to copy selection
# unbind -T copy-mode-vi MouseDragEnd1Pane

# always split window in current dir
# split window usin prefix + - and | 
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
